[package]
name = "remo-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
clap = { version = "4.5.23", features = ["derive"] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
log = "0.4.22"
reqwest = { version = "0.12.11", default-features = false, features = ["charset", "http2", "json", "macos-system-configuration", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.217", features = ["derive"] }
time = { version = "0.3.37", features = ["serde-well-known"] }
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
